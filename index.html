<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GGS Timetable</title>
<meta name="theme-color" content="#12676A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-192.png">
<link rel="apple-touch-icon" href="app-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column planner. App bar with date title, week strip, tonal "next up" card, colour-coded agenda; Material 3 style pill navigation. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#ECEEF2; --ink:#15171C; --muted:#5F6573; --line:#E2E5EA;
  --pri:#0E7C7B; --on-pri:#FFFFFF; --pri-c:#D2EEEB; --on-pri-c:#063B3A;
  --accent:#E35A45; --on-accent:#FFFFFF; --warn:#8F5A00; --warn-c:#FCEBCB; --bad:#B3261E; --bad-c:#FFDAD6;
  --ev-s:72%; --ev-l:94%; --dot-s:58%; --dot-l:46%; --ev-ink-l:24%;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --f-display:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1114; --surface:#181B20; --surface-2:#23272E; --ink:#E7E9EE; --muted:#9AA1AD; --line:#2B3038;
  --pri:#5ED3CC; --on-pri:#00302E; --pri-c:#133F3D; --on-pri-c:#C2F1EC;
  --accent:#FF8A73; --on-accent:#3A0A03; --warn:#F2C16B; --warn-c:#3A2D10; --bad:#FFB4AB; --bad-c:#4A1612;
  --ev-s:28%; --ev-l:19%; --dot-s:70%; --dot-l:68%; --ev-ink-l:90%; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#181B20; --surface-2:#23272E; --ink:#E7E9EE; --muted:#9AA1AD; --line:#2B3038;
  --pri:#5ED3CC; --on-pri:#00302E; --pri-c:#133F3D; --on-pri-c:#C2F1EC;
  --accent:#FF8A73; --on-accent:#3A0A03; --warn:#F2C16B; --warn-c:#3A2D10; --bad:#FFB4AB; --bad-c:#4A1612;
  --ev-s:28%; --ev-l:19%; --dot-s:70%; --dot-l:68%; --ev-ink-l:90%; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 24px}
/* app bar */
.appbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 12px}
.appbar .eyebrow{margin:0;font:600 13px/1.2 var(--f-body);color:var(--muted)}
.appbar h1{margin:2px 0 0;font:800 30px/1.05 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--f-body);padding:8px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:0}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.chip.live{background:var(--pri-c);color:var(--on-pri-c)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
h2{font:700 13px/1.2 var(--f-body);letter-spacing:.02em;color:var(--muted);margin:24px 0 10px}
h3{font:700 19px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.mono{font:500 13px/1.35 var(--f-body);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 0 10px}
.sec-head h2{margin:0}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
/* buttons */
button,.btn{font:600 14px/1 var(--f-body);border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn.primary,button.primary{background:var(--pri);color:var(--on-pri)}
.btn.hot,button.hot{background:var(--accent);color:var(--on-accent)}
.btn.tonal,button.tonal{background:var(--pri-c);color:var(--on-pri-c)}
button.ghost{background:transparent;color:var(--pri)}
button.small,.btn.small{min-height:34px;padding:8px 13px;font-size:13px}
button.danger{background:var(--bad-c);color:var(--bad)}
button:disabled{opacity:.6}
.icon-btn{width:42px;height:42px;padding:0;border-radius:50%}
.icon-btn svg,.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* chips */
.pill{font:600 11.5px/1 var(--f-body);padding:5px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.ex{background:var(--surface-2);color:var(--muted)}
.pill.lec{background:var(--pri-c);color:var(--on-pri-c)}
.pill.chg,.pill.q{background:var(--warn-c);color:var(--warn)}
.pill.cx{background:var(--bad-c);color:var(--bad)}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 6px}
.sd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:16px;background:transparent;min-height:0;color:var(--ink)}
.sd .wd{font:600 11.5px/1 var(--f-body);color:var(--muted)}
.sd .dn{font:700 18px/1.1 var(--f-display)}
.sd .dots{display:flex;gap:3px;height:5px}
.sd .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.55}
.sd.today .dn{color:var(--pri)}
.sd[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.sd[aria-pressed="true"] .wd,.sd[aria-pressed="true"] .dn{color:var(--on-pri)}
.sd[aria-pressed="true"] .dots i{background:var(--on-pri);opacity:.8}
.sd.off{opacity:.45}
/* next up */
.next{background:var(--pri-c);color:var(--on-pri-c);border-radius:28px;padding:18px;box-shadow:none}
.next.urgent{background:var(--accent);color:var(--on-accent)}
.next[data-card-occ]{cursor:pointer}
.next .lbl{font:700 12.5px/1 var(--f-body);letter-spacing:.02em;opacity:.8}
.next h3{margin-top:8px;font-size:22px}
.next .sub{margin-top:4px;opacity:.85;font-weight:500}
.next .leave{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.next .big{font:800 40px/1 var(--f-display);letter-spacing:-.03em}
.next .big small{font:600 15px/1 var(--f-body);letter-spacing:0;opacity:.8;margin-left:6px}
.meter{height:6px;border-radius:999px;background:color-mix(in srgb,currentColor 18%,transparent);margin-top:14px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:inherit;background:currentColor}
.next .trav{margin-top:10px;font-weight:500;opacity:.9}
.next .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.next .btn.primary{background:var(--on-pri-c);color:var(--pri-c)}
.next.urgent .btn.primary{background:var(--on-accent);color:var(--accent)}
.next button.tonal{background:color-mix(in srgb,currentColor 14%,transparent);color:inherit}
.next .notice{background:color-mix(in srgb,currentColor 12%,transparent);color:inherit;border:0}
/* agenda */
.agenda{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;width:100%;text-align:left;background:none;padding:0;border-radius:0;min-height:0;color:inherit;font:inherit;align-items:stretch}
.ev-time{display:flex;flex-direction:column;padding-top:12px;font:700 14px/1.2 var(--f-body)}
.ev-time span{font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.ev-card{background:hsl(var(--c) var(--ev-s) var(--ev-l));border-radius:18px;padding:12px 14px;min-width:0;color:hsl(var(--c) 40% var(--ev-ink-l))}
.ev-title{font:700 15.5px/1.25 var(--f-body);display:flex;gap:8px;align-items:baseline}
.ev-title::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:hsl(var(--c) var(--dot-s) var(--dot-l));transform:translateY(-1px)}
.ev-meta{font:500 13px/1.35 var(--f-body);opacity:.8;margin-top:3px;padding-left:16px}
.ev-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-left:16px}
.ev-tags .pill{background:color-mix(in srgb,currentColor 12%,transparent);color:inherit}
.ev-tags .pill.cx{background:var(--bad-c);color:var(--bad)}
.ev-tags .pill.chg,.ev-tags .pill.q{background:var(--warn-c);color:var(--warn)}
.ev.past{opacity:.5}
.ev.cancel .ev-title{text-decoration:line-through}
.ev.live .ev-card{outline:2px solid hsl(var(--c) var(--dot-s) var(--dot-l));outline-offset:-2px}
.nowline{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;color:var(--accent);font:700 12px/1 var(--f-body)}
.nowline i{height:2px;background:var(--accent);border-radius:2px;position:relative}
.nowline i::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.gap{display:grid;grid-template-columns:52px 1fr;gap:10px;text-decoration:none;color:var(--muted);font:500 13px/1.3 var(--f-body)}
.gap div{border:1.5px dashed var(--line);border-radius:14px;padding:9px 12px;display:flex;justify-content:space-between;gap:8px}
.gap b{color:var(--pri);font-weight:600}
/* week */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav strong{font:700 18px/1.2 var(--f-display)}
.wday{display:flex;flex-direction:column;gap:6px}
.wday-h{display:flex;align-items:baseline;gap:8px;margin:18px 0 2px;font:700 15px/1 var(--f-body)}
.wday-h span{color:var(--muted);font-weight:500}
.wday-h.today{color:var(--pri)}
.wrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border-radius:16px;padding:10px 12px;min-height:0;font:inherit;color:hsl(var(--c) 40% var(--ev-ink-l));background:hsl(var(--c) var(--ev-s) var(--ev-l))}
.wrow .t{font:700 13.5px/1.25 var(--f-body);width:44px;flex:none}
.wrow .t small{display:block;font-weight:500;font-size:12.5px;opacity:.72;margin-top:1px}
#v-week{padding-bottom:72px}
.wrow .n{min-width:0;flex:1}
.wrow .n b{display:block;font:600 14px/1.25 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .n span{font:500 12.5px/1.3 var(--f-body);opacity:.8}
.wrow.dim{opacity:.45}
.wrow.cancel b{text-decoration:line-through}
.wempty{color:var(--muted);font-size:13.5px;padding:4px 2px}
.course{display:flex;gap:12px;align-items:center;flex-wrap:nowrap}
.course .sw{width:12px;height:12px;border-radius:50%;flex:none;background:hsl(var(--c) var(--dot-s) var(--dot-l))}
.course>div{min-width:0;flex:1}
/* forms */
label{display:flex;flex-direction:column;gap:6px;font:600 12.5px/1.2 var(--f-body);color:var(--muted)}
input,select,textarea{font:500 15px/1.3 var(--f-body);color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;padding:12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--pri);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{flex-direction:row;align-items:center;justify-content:space-between;font:500 15px/1.3 var(--f-body);color:var(--ink)}
.toggle input{width:22px;height:22px;flex:none;accent-color:var(--pri)}
.set{display:flex;flex-direction:column;gap:14px}
.result{display:block;width:100%;text-align:left;font-weight:500;border-radius:14px}
/* campus */
.meal{display:flex;justify-content:space-between;gap:12px;padding:10px 0}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.fchip{min-height:34px;padding:7px 13px;font-size:13px;background:var(--surface-2);color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--pri-c);color:var(--on-pri-c)}
.pick .pill{background:color-mix(in srgb,currentColor 14%,transparent);color:inherit}
.plate{margin-top:14px;border-top:1px solid color-mix(in srgb,currentColor 20%,transparent);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;gap:12px;font-weight:500}
.prow.tot{font-weight:800;font-size:17px;margin-top:4px}
.dtags{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.trow{display:flex;gap:12px;align-items:flex-start}
.trow .pill{margin-top:2px}
.tname{font:600 16px/1.35 var(--f-body)}
.dish{width:100%;-webkit-touch-callout:none;user-select:none;text-align:left;background:none;border-top:1px solid var(--line);border-radius:0;min-height:0;font:inherit;color:inherit;cursor:pointer;padding:11px 0}
.card h2+.dish{border-top:0}
.meal .price{font:600 13.5px/1.3 var(--f-body);white-space:nowrap}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg a{flex:1;text-align:center;padding:10px 0;border-radius:999px;text-decoration:none;color:var(--muted);font:700 14px/1 var(--f-body)}
.seg a[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dist{font:800 20px/1 var(--f-display);color:var(--pri)}
.bgstat{border-radius:14px;padding:12px;background:var(--surface-2)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:0 -1px 0 var(--line);
  padding:8px max(6px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:flex;justify-content:space-around}
nav.tabs a{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font:600 12px/1 var(--f-body)}
nav.tabs .ic{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px;transition:background .15s}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] .ic{background:var(--pri-c);color:var(--on-pri-c)}
/* sheet, toast, misc */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;
  padding:14px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet{touch-action:pan-y;overscroll-behavior:contain}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--muted);opacity:.45;margin:0 auto 18px;box-shadow:0 0 0 14px transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;max-width:calc(100% - 32px);font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.notice{background:var(--warn-c);color:var(--warn);padding:11px 13px;border-radius:14px;font-weight:500}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:15;width:56px;height:56px;border-radius:18px;background:var(--pri-c);color:var(--on-pri-c);box-shadow:0 6px 18px rgba(0,0,0,.18);padding:0}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .2s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
</style>
</head>

<div class="wrap">

    <div style="min-width:0"><p class="eyebrow" id="hdrEyebrow"></p><h1 id="hdrTitle">Today</h1></div>

<script>
'use strict';
const E = window.Engine;
const NATIVE = !!(window.Native && window.Native.isNative);
let UPDATE = null;
const $ = s => document.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

let S = E.defaultState(), A = {}, T = {}, LOC = null;
let view = 'today', selDay = null, campusTab = 'mensa', weekOffset = 0, mensaDay = 0, swReg = null, idbOK = true;

// ---------- persistence ----------
async function save() { try { await E.kvSet('state', S); } catch (e) { idbOK = false; } scheduleSoon(); }
async function reloadShared() {
  try { A = (await E.kvGet('answers')) || {}; T = (await E.kvGet('travel')) || {}; } catch (e) {}
}
async function answer(setId, date, opt) {
  try { A = await E.setAnswer(setId, date, opt); } catch (e) { if (opt) A[setId + '|' + date] = opt; else delete A[setId + '|' + date]; }
  render(); runTick();
}

// ---------- helpers ----------
function toast(msg, ms) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; el.setAttribute('role', 'status');
  $('#toastHost').replaceChildren(el); setTimeout(() => el.remove(), ms || 3200);
}
function dur(ms) {
  const m = Math.round(ms / 60000); if (m < 1) return 'now';
  if (m < 60) return m + ' min'; const hh = Math.floor(m / 60), mm = m % 60;
  if (hh < 24) return hh + ' h' + (mm ? ' ' + mm + ' min' : ''); const d = Math.round(hh / 24); return d + (d === 1 ? ' day' : ' days');
}

function coord(p) { return p.lat == null ? '' : p.lat.toFixed(4) + '° N · ' + p.lng.toFixed(4) + '° E'; }

// Bottom sheet: closes with Close, a tap outside, a downward swipe, or the Android back gesture.
function openSheet(html, onMount) {
  const host = $('#sheetHost');
  const wasOpen = !!host.firstChild;
  host.innerHTML = '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>' + html + '</div></div>';
  const scrim = $('#scrim'), sheet = host.querySelector('.sheet');
  scrim.addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
  // One history entry per open sheet, so Back closes the sheet instead of leaving the app.
  if (!wasOpen) { try { history.pushState({ sheet: true }, ''); } catch (e) {} }
  let y0 = null, dy = 0, t0 = 0, dragging = false;
  sheet.addEventListener('touchstart', e => {
    if (e.target.closest('input,select,textarea')) { y0 = null; return; }
    const top = e.touches[0].clientY - sheet.getBoundingClientRect().top;
    if (sheet.scrollTop > 0 && top > 56) { y0 = null; return; } // scrolled: only the handle area drags
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); dragging = false;
  }, { passive: true });

    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;

      scrim.style.background = 'rgba(10,12,16,' + Math.max(0, .45 * (1 - dy / sheet.offsetHeight)).toFixed(3) + ')';
    }
  }, { passive: false });
  sheet.addEventListener('touchend', () => {
    if (y0 == null || !dragging) { y0 = null; return; }
    const fast = dy / Math.max(1, Date.now() - t0) > 0.6;
    y0 = null;
    if (dy > Math.min(140, sheet.offsetHeight * .3) || (fast && dy > 40)) closeSheet();
    else { sheet.style.transition = 'transform .2s cubic-bezier(.2,.8,.2,1)'; sheet.style.transform = ''; scrim.style.background = ''; }
  });
  if (onMount) onMount(sheet);
}
function closeSheet(fromHistory) {
  const host = $('#sheetHost'), sheet = host.querySelector('.sheet');
  if (!sheet) return;
  if (fromHistory !== true && history.state && history.state.sheet) { try { history.back(); } catch (e) {} return; } // popstate finishes the close
  const scrim = $('#scrim');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { host.innerHTML = ''; return; }

  if (scrim) { scrim.style.transition = 'background .18s'; scrim.style.background = 'rgba(10,12,16,0)'; }

}
window.addEventListener('popstate', () => { if ($('#sheetHost').querySelector('.sheet')) closeSheet(true); });
async function shareOrDownload(name, text, mime) {
  if (NATIVE) { try { await Native.shareFile(name, text, mime); } catch (e) { toast('Could not share the file: ' + e.message, 5000); } return; }
  const file = new File([text], name, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

// One colour per course family (lecture + exercise share it).
const HUES = [262, 22, 168, 212, 330, 140, 45, 290];
function famKey(c) { const m = c.title.match(/\(([^)]+)\)/); return (m ? m[1] : c.title).toLowerCase().trim(); }

// ---------- TODAY ----------
function groupQuestions() {
  // unanswered group choices for today (if still upcoming) and tomorrow
  const out = [];
  const now = new Date();
  for (const off of [0, 1]) {
    const d = E.addDays(now, off), ds = E.ymd(d);
    const occ = E.occurrences(S, A, d, d, { allGroups: true }).filter(o => o.course.group && !o.cancelled);
    const sets = {};
    occ.forEach(o => (sets[o.course.group.set] = sets[o.course.group.set] || []).push(o));
    for (const setId in sets) {
      if (A[setId + '|' + ds]) continue;
      const opts = sets[setId].sort((a, b) => a.start - b.start);
      if (off === 0 && opts.every(o => o.end < now)) continue;
      out.push({ setId, ds, d, off, opts });
    }
  }
  return out;
}

function dayItems(d) {
  return E.occurrences(S, A, d, d, { allGroups: true }).filter(o => !(o.course.group && o.chosen && o.chosen !== o.course.group.option));
}

async function findAddress(text, box, onPick) {
  if (!text.trim()) { toast('Type an address first'); return; }
  box.innerHTML = '<p class="muted">Searching…</p>';
  try {
    const res = await E.geocode(text.includes('Berlin') ? text : text + ', Berlin');
    if (!res.length) { box.innerHTML = '<p class="muted">No match. Try street and house number.</p>'; return; }
    box.innerHTML = res.map((r, i) => '<button class="result small" data-i="' + i + '">' + h(r.name) + ' <span class="mono muted">' + r.lat.toFixed(4) + ', ' + r.lng.toFixed(4) + '</span></button>').join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => { onPick(res[Number(b.dataset.i)]); box.innerHTML = '<p class="muted">Location saved.</p>'; });
  } catch (e) { box.innerHTML = '<p class="muted">Address search is unreachable (' + h(e.message) + '). Check your connection.</p>'; }
}

const CAT_EN = { 'Essen': 'Mains', 'Hauptgerichte': 'Mains', 'Beilagen': 'Sides', 'Salate': 'Salads', 'Suppen': 'Soups', 'Desserts': 'Desserts', 'Vorspeisen': 'Starters', 'Aktionen': 'Specials', 'Aktion': 'Specials', 'Tagesgericht': "Today's dish", 'Pasta': 'Pasta', 'Pizza': 'Pizza', 'Grill': 'Grill', 'Snacks': 'Snacks' };
function catName(c) { return CAT_EN[c] || c; }
const trMem = {};
function trCacheGet(k) { if (k in trMem) return trMem[k]; try { const v = localStorage.getItem(k); if (v != null) trMem[k] = v; return v; } catch (e) { return null; } }
function trCacheSet(k, v) { trMem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
const translators = {};
async function translate(text, to) {
  if (!text) return null;
  const key = 'tr:' + to + ':' + text;
  const hit = trCacheGet(key); if (hit) return hit;
  let out = null;
  // 1) Chrome's on-device translator, where the phone has it
  // It can hang on some devices, so it gets a few seconds before the web service takes over.
  const within = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  try {
    if ('Translator' in self && translators[to] !== false) {
      const av = await within(self.Translator.availability({ sourceLanguage: 'de', targetLanguage: to }), 1500);
      if (av === 'available') {
        translators[to] = translators[to] || self.Translator.create({ sourceLanguage: 'de', targetLanguage: to });
        out = await within((await within(translators[to], 2500)).translate(text), 3000);
      }
    }
  } catch (e) { out = null; translators[to] = false; }
  // 2) MyMemory free translation service
  if (!out) {
    try {
      const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=de|' + to);
      if (r.ok) {
        const j = await r.json();
        const t = j && j.responseData && j.responseData.translatedText;
        if (t && j.responseStatus == 200 && !/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(t)) out = t;
      }
    } catch (e) { out = null; }
  }
  if (out) { out = out.trim(); trCacheSet(key, out); }
  return out;
}
async function runLimited(tasks, limit) {
  let i = 0;
  const worker = async () => { while (i < tasks.length) { const t = tasks[i++]; try { await t(); } catch (e) {} } };
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
}

let libFix = null, libAsking = false;

// Street walking ≈ 1.25 × straight line at 4.8 km/h.
function walkMin(km) { return Math.max(1, Math.round(km * 1.25 / 4.8 * 60)); }
function libFixFresh() {
  const now = Date.now();
  if (libFix && now - libFix.ts < 5 * 60000) return libFix;
  if (S.settings.useLocation && LOC && now - LOC.ts < 5 * 60000) return LOC;
  return null;
}
// Ask for one fresh position when the list opens, so distances reflect where you are right now.
function askLibFix(fromButton) {
  if (libAsking || !('geolocation' in navigator)) return;
  if (!fromButton && !S.settings.useLocation) return;
  libAsking = true; renderLibraries();
  navigator.geolocation.getCurrentPosition(p => {
    libAsking = false;
    libFix = { lat: p.coords.latitude, lng: p.coords.longitude, ts: Date.now(), acc: p.coords.accuracy };
    if (S.settings.useLocation) { LOC = libFix; E.kvSet('loc', LOC).catch(() => {}); renderHeader(); }
    if (view === 'mensa' && campusTab === 'libraries') renderLibraries();
  }, err => {
    libAsking = false;
    if (view === 'mensa' && campusTab === 'libraries') renderLibraries();
    toast(err.code === 1 ? 'Location is blocked. Allow it for this site in Chrome, and for Chrome in Android settings.' : 'Could not get your location. Try again outside or with Wi-Fi on.', 5500);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
}

const mealCache = {};
async function getMeals(ds) {

  const r = await fetch(OM + '/canteens/' + id + '/days/' + ds + '/meals');

  return meals;
}

async function exportIcs() {
  const note = $('#icsNote'), btn = $('#sIcs');
  const a = S.addresses.find(x => x.id === S.defaultAddress);
  if (!a || a.lat == null) { toast('Set and locate your default address first'); return; }
  btn.disabled = true;
  const from = { lat: a.lat, lng: a.lng, label: a.label };
  const keys = new Set(S.courses.filter(c => c.enabled).map(c => c.building === 'OTHER' ? 'OTHER:' + c.id : c.building));
  S.exams.forEach(x => keys.add(x.building === 'OTHER' ? 'exam:' + x.id : x.building));
  const tm = {}; let i = 0, est = 0;
  const probe = E.addDays(E.mondayOf(new Date()), 7 + 1); probe.setHours(10, 0, 0, 0); // a Tuesday 10:00 next week
  for (const k of keys) {
    i++; note.textContent = 'Checking travel times ' + i + '/' + keys.size + '…';
    let place;
    if (k.startsWith('OTHER:')) place = E.placeOf(S, S.courses.find(c => 'OTHER:' + c.id === k));
    else if (k.startsWith('exam:')) place = E.placeOf(S, S.exams.find(x => 'exam:' + x.id === k));
    else place = E.BUILDINGS[k];
    if (!place || place.lat == null) continue;
    try { tm[k] = (await E.bvgJourney(from, place, probe)).minutes; } catch (e) { tm[k] = E.estimateMinutes(from, place); est++; }
  }
  const res = E.buildICS(S, A, tm, new Date());
  btn.disabled = false;
  note.textContent = 'Done.' + (res.skipped ? ' ' + res.skipped + ' group classes have no group yet; their alarms follow the earlier group.' : '') + (est ? ' ' + est + ' travel times are estimates.' : '');
  await shareOrDownload('tu-ggs-timetable.ics', res.text, 'text/calendar');
}

// ---------- Android app: real alarms ----------
async function addrMinutes(place, startDate) {
  const a = S.addresses.find(x => x.id === S.defaultAddress);
  if (!a || a.lat == null || place.lat == null) return null;
  const ck = place.lat.toFixed(4) + ',' + place.lng.toFixed(4) + '|' + a.lat.toFixed(4) + ',' + a.lng.toFixed(4) + '|' + startDate.getDay() + '-' + startDate.getHours();
  let cache = {}; try { cache = (await E.kvGet('addrTravel')) || {}; } catch (e) {}
  const hit = cache[ck];
  if (hit && Date.now() - hit.ts < 3 * 86400000) return Object.assign({ from: a.label }, hit);
  let res;
  try { const r = await E.bvgJourney({ lat: a.lat, lng: a.lng, label: a.label }, place, startDate); res = { min: r.minutes, lines: r.lines, src: 'bvg', ts: Date.now() }; }
  catch (e) { res = { min: E.estimateMinutes(a, place), lines: [], src: 'estimate', ts: Date.now() - 3 * 86400000 + 3600000 }; } // retry in an hour
  cache[ck] = res; try { await E.kvSet('addrTravel', cache); } catch (e) {}
  return Object.assign({ from: a.label }, res);
}
// Everything that should ring in the next 7 days.
async function buildNativeItems() {
  const now = Date.now(), st = S.settings, items = [];
  if (!st.notify) return items;
  const a = S.addresses.find(x => x.id === S.defaultAddress);
  for (const it of E.upcomingTargets(S, A, now, 24 * 7)) {
    let m = null;
    // Within the next 10 hours: live position or cached BVG result. Later: from the default address.
    if (it.start - now < 10 * 3600000) {
      const tr = E.travelFor(S, T, LOC, now, it);
      if (tr && (tr.source === 'bvg' || !a || a.lat == null)) m = { min: tr.minutes, lines: tr.lines || [], src: tr.source, from: tr.origin };
    }
    if (!m) m = await addrMinutes(it.place, new Date(it.start - st.bufferMin * 60000));
    const leave = it.start.getTime() - ((m ? m.min : 30) + st.bufferMin) * 60000;
    const where = it.room ? it.room + ' · ' : '';
    const how = m ? m.min + ' min' + (m.lines && m.lines.length ? ' by ' + m.lines.join(' → ') : m.src === 'bvg' ? ' on foot' : ' (estimate)') + ' from ' + m.from : 'Add your address in Settings for travel times';
    const grp = it.pending ? ' Group not chosen yet.' : '';
    items.push({ key: it.id + '|first', at: leave - st.leadFirst * 60000, title: 'Leave in ' + st.leadFirst + ' min · ' + it.title, body: 'Starts ' + E.hm(it.start) + ' · ' + where + how + '.' + grp });
    items.push({ key: it.id + '|second', at: leave - st.leadSecond * 60000, title: 'Leave in ' + st.leadSecond + ' min · ' + it.title, body: 'Starts ' + E.hm(it.start) + ' · ' + where + how + '.' + grp });
    items.push({ key: it.id + '|now', at: leave, title: 'Leave now · ' + it.title, body: 'Leave now to reach ' + (it.room || it.place.name) + ' by ' + E.hm(it.start) + '. ' + how + '.' + grp, urgent: true });
  }
  for (let off = 1; off <= 7; off++) {
    const d = E.addDays(new Date(now), off), ds = E.ymd(d), eve = E.ymd(E.addDays(d, -1));
    const sets = {};
    E.occurrences(S, A, d, d, { allGroups: true }).filter(o => o.course.group && !o.cancelled).forEach(o => (sets[o.course.group.set] = sets[o.course.group.set] || []).push(o));
    for (const setId in sets) {
      if (A[setId + '|' + ds]) continue;
      const opts = sets[setId].sort((x, y) => x.start - y.start);
      items.push({ key: 'gq|' + setId + '|' + ds, at: E.at(eve, st.groupAskTime).getTime(), channel: 'ggs-info', group: { set: setId, date: ds },
        title: 'Which group tomorrow? ' + E.GROUP_SETS[setId].name,
        body: opts.map(o => 'Group ' + o.course.group.option + ': ' + E.hm(o.start) + '–' + E.hm(o.end) + ' ' + o.room).join(' · ') + (S.groupDefault[setId] ? ' (default ' + S.groupDefault[setId] + ')' : '') });
    }
  }
  for (const ex of S.exams) {
    if (!ex.date) continue;
    const eve = E.ymd(E.addDays(E.parseYmd(ex.date), -1));
    items.push({ key: 'exeve|' + ex.id, at: E.at(eve, st.examEveTime).getTime(), channel: 'ggs-info', hash: 'exams', title: 'Exam tomorrow: ' + ex.title, body: (ex.time || '') + ' ' + (ex.room || '') });
  }
  return items;
}
let schedTimer = null, schedBusy = false;
function scheduleSoon() { if (!NATIVE) return; clearTimeout(schedTimer); schedTimer = setTimeout(scheduleNative, 1200); }
async function scheduleNative() {
  if (schedBusy) { scheduleSoon(); return; }
  schedBusy = true;
  try { const n = await Native.replaceAll(await buildNativeItems()); try { await E.kvSet('lastSched', { n, at: Date.now() }); } catch (e) {} }
  catch (e) { console.log('schedule failed', e && e.message); }
  schedBusy = false;
  if (view === 'settings') fillBgStatus();
}
async function checkUpdate() {
  if (!NATIVE) return;
  try {
    const [r, st] = await Promise.all([fetch('app-version.json', { cache: 'no-store' }), Native.status()]);
    if (!r.ok || !st.app) return;
    const v = await r.json();
    if (Number(v.build) > Number(st.app.build)) { UPDATE = v; render(); }
  } catch (e) {}
}

// ---------- keep the open app on the newest version ----------
// Android keeps the app alive in the background, so it may never reload by itself.
const WEB_V = Number(((document.querySelector('script[src^="engine.js"]') || {}).getAttribute && document.querySelector('script[src^="engine.js"]').getAttribute('src').match(/v=(\d+)/) || [])[1] || 0);
let lastWebCheck = 0;
async function checkWebUpdate() {
  if (Date.now() - lastWebCheck < 60000) return;
  lastWebCheck = Date.now();
  try {
    const r = await fetch('index.html?check=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/engine\.js\?v=(\d+)/);
    if (m && Number(m[1]) > WEB_V && !$('#sheetHost').querySelector('.sheet')) {
      location.replace(location.pathname.replace(/index\.html$/, '') + '?v=' + m[1] + location.hash);
    }
  } catch (e) {}
}

// ---------- notifications & location ----------
async function showNote(a) {
  if (('Notification' in window) && Notification.permission === 'granted' && swReg) {
    try { await swReg.showNotification(a.title, { body: a.body, tag: a.tag, renotify: true, requireInteraction: !!a.urgent || !!a.actions, icon: 'app-192.png', badge: 'badge-96.png', vibrate: a.urgent ? [300, 150, 300, 150, 300] : [200], actions: a.actions || [], data: { url: a.url || './' } }); return; } catch (e) {}
  }
  toast(a.title + ' — ' + a.body, 7000);
}
async function enableNotifications() {
  if (!('Notification' in window)) { toast('This browser has no notifications'); return; }
  const p = await Notification.requestPermission();
  if (p === 'granted') {
    toast('Notifications on');
    try { if (swReg && 'periodicSync' in swReg) { const st = await navigator.permissions.query({ name: 'periodic-background-sync' }); if (st.state === 'granted') await swReg.periodicSync.register('reminders', { minInterval: 15 * 60000 }); } } catch (e) {}
  } else toast('Notifications are blocked. Allow them in Android settings for this app.', 5000);
  renderSettings();
}
let watchId = null;
function startLocation() {
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (!S.settings.useLocation || !('geolocation' in navigator)) return;
  watchId = navigator.geolocation.watchPosition(p => {
    const prev = LOC;
    LOC = { lat: p.coords.latitude, lng: p.coords.longitude, ts: Date.now() };
    E.kvSet('loc', LOC).catch(() => {});
    const moved = !prev || Math.abs(prev.lat - LOC.lat) + Math.abs(prev.lng - LOC.lng) > 0.004;
    renderHeader(); if (moved) runTick();
    if (view === 'mensa' && campusTab === 'libraries' && !libAsking) renderLibraries();
  }, () => { renderHeader(); }, { enableHighAccuracy: false, maximumAge: 120000, timeout: 20000 });
}
let ticking = false;
async function runTick(force) {
  if (ticking) return; ticking = true;
  if (NATIVE) {
    // The app's alarms are already scheduled; only refresh travel times and reschedule.
    try { const tr = (await E.kvGet('travel')) || {}; T = await E.refreshTravel(S, A, tr, LOC, Date.now()); await E.kvSet('travel', T); A = (await E.kvGet('answers')) || A; } catch (e) {}
    ticking = false; scheduleSoon();
    if (view === 'today' || force) renderToday();
    return;
  }
  try { await E.tick(showNote, LOC); await reloadShared(); } catch (e) {}
  ticking = false;
  if (view === 'today' || force) renderToday();
}

// ---------- routing & events ----------
function render() {
  try {
    renderHeader();
    if (view === 'today') renderToday(); else if (view === 'week') renderWeek(); else if (view === 'exams') renderExams(); else if (view === 'mensa') Promise.resolve(renderMensa()).catch(showBroken); else renderSettings();
  } catch (e) { showBroken(e); }
}
// Never leave a blank screen: a half-updated app (new page, old engine) lands here.
function showBroken(e) {
  const el = $('#v-' + view); if (!el) return;
  el.innerHTML = '<div class="notice"><strong>The app is still updating.</strong><p style="margin-top:6px">Close it completely and open it again. If this stays, pull down to reload.</p><p class="mono muted" style="margin-top:6px">' + h(e && e.message) + '</p></div>';
  if (swReg) swReg.update().catch(() => {});
}
function route() {
  const hsh = location.hash.replace('#', '');
  view = ({ today: 'today', week: 'week', exams: 'exams', mensa: 'mensa', libraries: 'mensa', prefs: 'settings' })[hsh] || 'today';
  if (hsh === 'libraries') campusTab = 'libraries'; else if (hsh === 'mensa') campusTab = 'mensa';
  ['today', 'week', 'exams', 'mensa', 'settings'].forEach(v => { $('#v-' + v).hidden = v !== view; });
  document.querySelectorAll('nav.tabs a').forEach(a => { if (a.dataset.v === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (view === 'today') selDay = null;
  $('#sheetHost').innerHTML = ''; render(); window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const ans = e.target.closest('[data-ans]'); if (ans) { const [s, d, o] = ans.dataset.ans.split('|'); answer(s, d, o || null); closeSheet(); toast(o ? 'Group ' + o + ' for ' + fmtDate(E.parseYmd(d)) : 'You will be asked again'); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) {
    const t = cp.dataset.copy;
    navigator.clipboard.writeText(t).then(() => toast('Address copied'), () => toast(t, 6000));
    return;
  }
  const fp = e.target.closest('[data-fpref]'); if (fp) { const k = fp.dataset.fpref; S.settings.foodPrefs = Object.assign(foodPrefs(), { [k]: !foodPrefs()[k] }); save(); renderMensa(); return; }
  const dy = e.target.closest('[data-day]'); if (dy) { selDay = dy.dataset.day; renderHeader(); renderToday(); return; }
  const dish = e.target.closest('[data-dish]'); if (dish) { if (!pressFired && e.detail === 0) showDish(dish); pressFired = false; return; }
  const cardOcc = e.target.closest('[data-card-occ]');
  if (cardOcc && !e.target.closest('a,button')) { occSheet(cardOcc.dataset.cardOcc); return; }
  const oc = e.target.closest('[data-occ]'); if (oc) { occSheet(oc.dataset.occ); return; }
  const ed = e.target.closest('[data-edit]'); if (ed) { editCourse(ed.dataset.edit); return; }
  const ex = e.target.closest('[data-exam]'); if (ex) { editExam(ex.dataset.exam); return; }
});
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkWebUpdate(); reloadShared().then(() => { render(); runTick(); }); } });

(async function boot() {
  try { const all = await E.loadAll(); S = all.state; A = all.answers; T = all.travel; LOC = all.loc; await save(); } catch (e) { idbOK = false; }
  if (NATIVE) {
    Native.init({
      onGroup: (setId, date, opt) => answer(setId, date, opt),
      onOpen: hash => { if (location.hash !== '#' + hash) location.hash = hash; },
      onResume: () => { checkWebUpdate(); reloadShared().then(() => { render(); runTick(); }); checkUpdate(); }
    });
    // Outside links (Maps, stw.berlin) open in their Android apps.
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href]'); if (!a) return;
      const u = new URL(a.getAttribute('href'), location.href);
      if (u.origin !== location.origin) { e.preventDefault(); e.stopPropagation(); Native.openExternal(u.href); }
    }, true);
    Native.status().then(st => { if (st.notify !== 'granted') Native.requestNotify().then(scheduleSoon); });
    checkUpdate(); scheduleSoon();
  } else if ('serviceWorker' in navigator) {
    try {
      swReg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
      navigator.serviceWorker.addEventListener('message', ev => {
        if (ev.data && ev.data.type === 'answers-changed') reloadShared().then(render);
        if (ev.data && ev.data.type === 'open') location.hash = ev.data.hash;
      });
      if ('periodicSync' in swReg && Notification.permission === 'granted') {
        const st = await navigator.permissions.query({ name: 'periodic-background-sync' }).catch(() => null);
        if (st && st.state === 'granted') swReg.periodicSync.register('reminders', { minInterval: 15 * 60000 }).catch(() => {});
      }
    } catch (e) {}
  }
  route(); startLocation(); runTick();
  setInterval(() => { if (!document.hidden) runTick(); }, 30000);
  setInterval(() => { if (!document.hidden) checkWebUpdate(); }, 15 * 60000);
})();
</script>
