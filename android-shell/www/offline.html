<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GGS Timetable</title>
<style>
:root{--bg:#F5F6F8;--ink:#15171C;--muted:#5F6573;--pri:#0E7C7B;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1114;--ink:#E7E9EE;--muted:#9AA1AD;--pri:#5ED3CC;--on:#00302E;color-scheme:dark}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
h1{font-size:22px;margin:0 0 8px}p{color:var(--muted);margin:0 0 22px;max-width:30ch}
button{font:600 15px system-ui,sans-serif;border:0;border-radius:999px;padding:13px 22px;background:var(--pri);color:var(--on)}
</style></head><body><div>
<h1>No connection</h1>
<p>Your reminders are already set and will still ring. Connect to the internet to open the timetable.</p>
<button onclick="location.href='https://ardaeerol.github.io/ggs-timetable/'">Try again</button>
</div></body></html>
